kind = "web"
previewPath = "/"
title = "LinkUps Adventures"
description = "A travel website for discovering Kenya adventures, comparing flexible-date trips, sending booking requests, and managing public content through a role-protected admin workspace."
version = "1.0.0"
id = "artifacts/linkups-adventures-port"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22931

[services.development]
run = "pnpm --filter @workspace/linkups-adventures-port run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/linkups-adventures-port", "run", "build" ]
serve = "static"
publicDir = "artifacts/linkups-adventures-port/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22931"
BASE_PATH = "/"
