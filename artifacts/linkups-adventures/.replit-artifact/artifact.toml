kind = "web"
previewPath = "/legacy-linkups"
title = "LinkUps Adventures Archive"
description = "Saved copy of the previous LinkUps Adventures site."
version = "1.0.0"
id = "artifacts/linkups-adventures"
router = "path"

[[services]]
name = "web"
paths = [ "/legacy-linkups" ]
localPort = 19104

[services.development]
run = "pnpm --filter @workspace/linkups-adventures run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/linkups-adventures", "run", "build" ]
serve = "static"
publicDir = "artifacts/linkups-adventures/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19104"
BASE_PATH = "/legacy-linkups"
