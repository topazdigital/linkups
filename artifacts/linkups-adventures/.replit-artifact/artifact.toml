kind = "web"
previewPath = "/"
title = "LinkUps Adventures"
description = "A travel and adventure site for discovering and planning Kenya safaris, beach escapes, camping trips, road trips, and group travel."
version = "1.0.0"
id = "artifacts/linkups-adventures"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19104

[services.development]
run = "pnpm --filter @workspace/linkups-adventures run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/linkups-adventures", "run", "build" ]
serve = "static"
publicDir = "artifacts/linkups-adventures/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19104"
BASE_PATH = "/"
