openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public
    description: Public booking and enquiry operations
  - name: admin
    description: Protected admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [public]
      summary: Submit a contact enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryCreated"
        "400":
          description: Invalid enquiry
  /bookings:
    post:
      operationId: createBooking
      tags: [public]
      summary: Request an adventure booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking request saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCreated"
        "400":
          description: Invalid booking request
  /adventures:
    get:
      operationId: listPublicAdventures
      tags: [public]
      summary: List published adventures
      responses:
        "200":
          description: Published adventures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Adventure"
  /events:
    get:
      operationId: listPublicEvents
      tags: [public]
      summary: List upcoming published events
      responses:
        "200":
          description: Upcoming published events in date order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
  /destinations:
    get:
      operationId: listPublicDestinations
      tags: [public]
      summary: List published destinations
      responses:
        "200":
          description: Published destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Destination"
  /site-content/{pageKey}:
    get:
      operationId: getPublicSiteContent
      tags: [public]
      summary: Get published content for a website page
      parameters:
        - in: path
          name: pageKey
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]+$" }
      responses:
        "200":
          description: Page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"
        "404":
          description: Page content not found
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Check the current account session
      responses:
        "200":
          description: Current authentication state and role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in as an administrator or customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Customer account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          description: Email address already exists
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current account session
      responses:
        "204":
          description: Session ended
  /account/dashboard:
    get:
      operationId: getCustomerDashboard
      tags: [account]
      summary: Get the signed-in customer's profile and bookings
      security:
        - UserSession: []
      responses:
        "200":
          description: Customer dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDashboard"
        "401":
          description: Customer sign-in required
  /account/profile:
    patch:
      operationId: updateCustomerProfile
      tags: [account]
      summary: Update the signed-in customer's profile
      security:
        - UserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Customer sign-in required
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check the current admin session
      responses:
        "200":
          description: Current authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Sign in to the admin dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Admin session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid admin credentials
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: End the current admin session
      responses:
        "204":
          description: Admin session ended
  /admin/bookings:
    get:
      operationId: listAdminBookings
      tags: [admin]
      summary: List booking requests
      responses:
        "200":
          description: Booking requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
  /admin/bookings/{id}:
    patch:
      operationId: updateBooking
      tags: [admin]
      summary: Update a booking status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingStatusUpdate"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Booking not found
  /admin/enquiries:
    get:
      operationId: listAdminEnquiries
      tags: [admin]
      summary: List contact enquiries
      responses:
        "200":
          description: Contact enquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enquiry"
  /admin/enquiries/{id}:
    patch:
      operationId: updateEnquiry
      tags: [admin]
      summary: Update an enquiry status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryStatusUpdate"
      responses:
        "200":
          description: Updated enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "404":
          description: Enquiry not found
  /admin/adventures:
    get:
      operationId: listAdminAdventures
      tags: [admin]
      summary: List published and unpublished adventures
      responses:
        "200":
          description: Adventures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Adventure"
    post:
      operationId: createAdventure
      tags: [admin]
      summary: Add an adventure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdventureInput"
      responses:
        "201":
          description: Adventure created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Adventure"
  /admin/adventures/{id}:
    patch:
      operationId: updateAdventure
      tags: [admin]
      summary: Edit or publish an adventure
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdventureUpdate"
      responses:
        "200":
          description: Updated adventure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Adventure"
        "404":
          description: Adventure not found
  /admin/events:
    get:
      operationId: listAdminEvents
      tags: [admin]
      summary: List all scheduled events
      security:
        - AdminSession: []
      responses:
        "200":
          description: Scheduled events, including drafts and past events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [admin]
      summary: Create a scheduled event
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /admin/events/{id}:
    patch:
      operationId: updateEvent
      tags: [admin]
      summary: Edit or publish a scheduled event
      security:
        - AdminSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Event not found
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List customer accounts
      security:
        - AdminSession: []
      responses:
        "200":
          description: Customer accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Activate or suspend a customer account
      security:
        - AdminSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated customer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "404":
          description: Customer account not found
  /admin/destinations:
    get:
      operationId: listAdminDestinations
      tags: [admin]
      summary: List all destinations
      security:
        - AdminSession: []
      responses:
        "200":
          description: Destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Destination"
    post:
      operationId: createDestination
      tags: [admin]
      summary: Add a destination
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationInput"
      responses:
        "201":
          description: Destination created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
  /admin/destinations/{id}:
    patch:
      operationId: updateDestination
      tags: [admin]
      summary: Edit or publish a destination
      security:
        - AdminSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationUpdate"
      responses:
        "200":
          description: Updated destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "404":
          description: Destination not found
  /admin/site-content:
    get:
      operationId: listAdminSiteContent
      tags: [admin]
      summary: List editable website page content
      security:
        - AdminSession: []
      responses:
        "200":
          description: Website page content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteContent"
    put:
      operationId: saveAdminSiteContent
      tags: [admin]
      summary: Save editable website page content
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteContentInput"
      responses:
        "200":
          description: Saved website page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"
components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: linkups_admin_session
    UserSession:
      type: apiKey
      in: cookie
      name: linkups_user_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    EnquiryInput:
      type: object
      required: [name, email, message]
      properties:
        name: { type: string, minLength: 2, maxLength: 150 }
        email: { type: string, format: email, maxLength: 190 }
        phone: { type: string, maxLength: 30 }
        service: { type: string, maxLength: 100 }
        message: { type: string, minLength: 2, maxLength: 8000 }
    EnquiryCreated:
      type: object
      required: [id, status]
      properties:
        id: { type: integer }
        status: { type: string, enum: [new] }
    BookingInput:
      type: object
      required: [fullName, email, phone, travellers]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 150 }
        email: { type: string, format: email, maxLength: 190 }
        phone: { type: string, minLength: 5, maxLength: 30 }
        adventureSlug: { type: ["string", "null"], maxLength: 200 }
        travelDate: { type: ["string", "null"], format: date }
        travellers: { type: integer, minimum: 1, maximum: 40 }
        specialRequests: { type: string, maxLength: 8000 }
    BookingCreated:
      type: object
      required: [reference, status, totalAmount]
      properties:
        reference: { type: string }
        status: { type: string, enum: [new] }
        totalAmount: { type: number }
    BookingStatus:
      type: string
      enum: [new, confirmed, in_progress, completed, cancelled]
    EnquiryStatus:
      type: string
      enum: [new, read, replied, archived]
    BookingStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/BookingStatus" }
    EnquiryStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/EnquiryStatus" }
    Booking:
      type: object
      required: [id, reference, fullName, email, phone, adventureTitle, travelDate, travellers, specialRequests, status, paymentStatus, totalAmount, createdAt]
      properties:
        id: { type: integer }
        reference: { type: string }
        fullName: { type: string }
        email: { type: string }
        phone: { type: string }
        adventureTitle: { type: ["string", "null"] }
        travelDate: { type: ["string", "null"], format: date }
        travellers: { type: integer }
        specialRequests: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/BookingStatus" }
        paymentStatus: { type: string, enum: [pending, paid, failed, refunded] }
        totalAmount: { type: number }
        createdAt: { type: string, format: date-time }
    Enquiry:
      type: object
      required: [id, name, email, phone, service, message, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        service: { type: ["string", "null"] }
        message: { type: string }
        status: { $ref: "#/components/schemas/EnquiryStatus" }
        createdAt: { type: string, format: date-time }
    AdminLoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 200 }
    AdminSession:
      type: object
      required: [authenticated, email]
      properties:
        authenticated: { type: boolean }
        email: { type: ["string", "null"] }
    AuthSession:
      type: object
      required: [authenticated, role, email, name]
      properties:
        authenticated: { type: boolean }
        role: { type: ["string", "null"], enum: [admin, customer, null] }
        email: { type: ["string", "null"], format: email }
        name: { type: ["string", "null"] }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 190 }
        password: { type: string, minLength: 8, maxLength: 200 }
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 190 }
        phone: { type: string, maxLength: 30 }
        password: { type: string, minLength: 8, maxLength: 200 }
    UserProfile:
      type: object
      required: [name, email, phone]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
    UserProfileUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: ["string", "null"], maxLength: 30 }
    CustomerDashboard:
      type: object
      required: [profile, bookings]
      properties:
        profile:
          $ref: "#/components/schemas/UserProfile"
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
    AdminUser:
      type: object
      required: [id, name, email, phone, role, isActive, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
        role: { type: string, enum: [customer, admin] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    AdminUserUpdate:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }
    Destination:
      type: object
      required: [id, name, slug, summary, description, imageUrl, isFeatured, isPublished]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        summary: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        isFeatured: { type: boolean }
        isPublished: { type: boolean }
    DestinationInput:
      type: object
      required: [name, slug, isPublished]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string, minLength: 2, maxLength: 140, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        summary: { type: string, maxLength: 1000 }
        description: { type: string, maxLength: 8000 }
        imageUrl: { type: string, maxLength: 500 }
        isFeatured: { type: boolean }
        isPublished: { type: boolean }
    DestinationUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string, minLength: 2, maxLength: 140, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        summary: { type: string, maxLength: 1000 }
        description: { type: string, maxLength: 8000 }
        imageUrl: { type: string, maxLength: 500 }
        isFeatured: { type: boolean }
        isPublished: { type: boolean }
    SiteContent:
      type: object
      required: [pageKey, pageTitle, heroTitle, heroSubtitle, seoDescription, bodyContent, heroImageUrl, heroImages, heroMode, isPublished, updatedAt]
      properties:
        pageKey: { type: string }
        pageTitle: { type: string }
        heroTitle: { type: ["string", "null"] }
        heroSubtitle: { type: ["string", "null"] }
        seoDescription: { type: ["string", "null"] }
        bodyContent: { type: ["string", "null"] }
        heroImageUrl: { type: ["string", "null"] }
        heroImages:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 500 }
        heroMode: { type: string, enum: [static, slideshow] }
        isPublished: { type: boolean }
        updatedAt: { type: string, format: date-time }
    SiteContentInput:
      type: object
      required: [pageKey, pageTitle, isPublished]
      properties:
        pageKey: { type: string, minLength: 2, maxLength: 60, pattern: "^[a-z0-9-]+$" }
        pageTitle: { type: string, minLength: 2, maxLength: 160 }
        heroTitle: { type: ["string", "null"], maxLength: 240 }
        heroSubtitle: { type: ["string", "null"], maxLength: 2000 }
        seoDescription: { type: ["string", "null"], maxLength: 500 }
        bodyContent: { type: ["string", "null"], maxLength: 20000 }
        heroImageUrl: { type: ["string", "null"], maxLength: 500 }
        heroImages:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 500 }
        heroMode: { type: string, enum: [static, slideshow] }
        isPublished: { type: boolean }
    Event:
      type: object
      required:
        - id
        - slug
        - title
        - description
        - eventDate
        - location
        - priceLabel
        - heroImageUrl
        - isPublished
        - createdAt
        - updatedAt
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        eventDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        location: { type: string }
        priceLabel: { type: ["string", "null"] }
        heroImageUrl: { type: ["string", "null"] }
        isPublished: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EventInput:
      type: object
      required: [slug, title, description, eventDate, location, isPublished]
      properties:
        slug: { type: string, minLength: 2, maxLength: 180, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        title: { type: string, minLength: 2, maxLength: 180 }
        description: { type: string, minLength: 2, maxLength: 2000 }
        eventDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        location: { type: string, minLength: 2, maxLength: 180 }
        priceLabel: { type: ["string", "null"], maxLength: 160 }
        heroImageUrl: { type: ["string", "null"], maxLength: 500 }
        isPublished: { type: boolean }
    EventUpdate:
      type: object
      minProperties: 1
      properties:
        slug: { type: string, minLength: 2, maxLength: 180, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        title: { type: string, minLength: 2, maxLength: 180 }
        description: { type: string, minLength: 2, maxLength: 2000 }
        eventDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        location: { type: string, minLength: 2, maxLength: 180 }
        priceLabel: { type: ["string", "null"], maxLength: 160 }
        heroImageUrl: { type: ["string", "null"], maxLength: 500 }
        isPublished: { type: boolean }
    Adventure:
      type: object
      required:
        - id
        - slug
        - title
        - category
        - durationDays
        - durationNights
        - price
        - priceUsd
        - pricingNote
        - description
